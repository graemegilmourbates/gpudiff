# Hourly refresh: fetch → validate → commit snapshot → deploy site → health gate.
name: refresh
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh sponsor slots from approved issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m pipeline.sponsor_intake

      - name: Run pipeline
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
        run: python3 -m pipeline.refresh

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Commit snapshot + changelog
        run: |
          git config user.name "foundry-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no data change" && exit 0
          git commit -m "data: refresh $(date -u +%F-%H%M)"
          # A human pushing while this run is in flight moves the remote and
          # the push is rejected. Rebase onto it and retry; on a data conflict
          # the fresher observation (this run's) wins.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected on attempt $attempt — remote moved; rebasing"
            git pull --rebase -X theirs origin main || git rebase --abort
          done
          echo "could not push after 3 attempts"
          exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tell search engines what changed (IndexNow is a public protocol; the
      # key file is served by the site). Once daily to stay polite.
      # Tell search engines what changed. Submits the whole sitemap (IndexNow
      # accepts up to 10k URLs per call), and fires whenever the hour-of-day
      # differs from the last ping — the old "== 06" check never matched once
      # because GitHub's cron queue drifts past the minute.
      - name: IndexNow ping
        run: |
          python3 - <<'EOF'
          import json, re, urllib.request, datetime, pathlib
          stamp = pathlib.Path("data/.indexnow-last")
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          if stamp.exists() and stamp.read_text().strip() == today:
              print("already pinged today"); raise SystemExit
          key = "f3a92c47d8b14e0aa65b7c3d91e2f086"
          urls = re.findall(r"<loc>([^<]+)</loc>", pathlib.Path("site/sitemap.xml").read_text())
          body = json.dumps({"host": "gpudiff.com", "key": key,
                             "keyLocation": f"https://gpudiff.com/{key}.txt",
                             "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"IndexNow: HTTP {r.status} for {len(urls)} URLs")
              stamp.write_text(today)
          except Exception as exc:
              print("IndexNow failed (non-fatal):", exc)
          EOF

      # After good data is committed and the site shipped: fail the job if any
      # source was degraded, so the sentinel pages humans without blocking publish.
      - name: Fail if degraded
        run: python3 -m pipeline.refresh --check-health
