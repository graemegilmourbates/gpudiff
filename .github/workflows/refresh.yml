# Hourly refresh: fetch → validate → commit snapshot → deploy site → health gate.
name: refresh
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run pipeline
        run: python3 -m pipeline.refresh

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Commit snapshot + changelog
        run: |
          git config user.name "foundry-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%F-%H%M)"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # After good data is committed and the site shipped: fail the job if any
      # source was degraded, so the sentinel pages humans without blocking publish.
      - name: Fail if degraded
        run: python3 -m pipeline.refresh --check-health
