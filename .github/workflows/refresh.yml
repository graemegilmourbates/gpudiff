# Hourly refresh: fetch → validate → commit snapshot → deploy site → health gate.
name: refresh
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run pipeline
        run: python3 -m pipeline.refresh

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Commit snapshot + changelog
        run: |
          git config user.name "foundry-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%F-%H%M)"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tell search engines what changed (IndexNow is a public protocol; the
      # key file is served by the site). Once daily to stay polite.
      - name: IndexNow ping (daily)
        run: |
          [ "$(date -u +%H)" = "06" ] || exit 0
          curl -s -m 30 -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{"host":"gpudiff.com","key":"f3a92c47d8b14e0aa65b7c3d91e2f086","keyLocation":"https://gpudiff.com/f3a92c47d8b14e0aa65b7c3d91e2f086.txt","urlList":["https://gpudiff.com/","https://gpudiff.com/llm/","https://gpudiff.com/saas/","https://gpudiff.com/changelog.html","https://gpudiff.com/badges.html","https://gpudiff.com/rss.xml"]}' || true

      # After good data is committed and the site shipped: fail the job if any
      # source was degraded, so the sentinel pages humans without blocking publish.
      - name: Fail if degraded
        run: python3 -m pipeline.refresh --check-health
