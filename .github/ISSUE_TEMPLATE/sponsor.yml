name: Sponsor gpudiff
description: Run a labelled sponsor unit on the site. Purchase first, then submit here.
title: "[Sponsor] <your company>"
labels: ["sponsor"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sponsoring gpudiff. Purchase a month at the link on
        [/sponsor.html](https://gpudiff.com/sponsor.html) first, then fill this in.
        Your unit goes live automatically once payment is confirmed — usually within the hour.
  - type: input
    id: name
    attributes: { label: Company / product name, placeholder: Acme GPU Cloud }
    validations: { required: true }
  - type: input
    id: url
    attributes: { label: Link URL (https://), placeholder: https://acme.example.com }
    validations: { required: true }
  - type: input
    id: tagline
    attributes: { label: One line of copy (max 80 chars), placeholder: "H100s from $1.79/hr, no minimums" }
    validations: { required: true }
  - type: dropdown
    id: section
    attributes:
      label: Placement
      options: ["Sitewide", "GPU pages only", "LLM pages only", "SaaS pages only"]
    validations: { required: true }
  - type: input
    id: payment
    attributes: { label: Payment reference / receipt email, placeholder: the email you paid with }
    validations: { required: true }
